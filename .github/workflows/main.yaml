name: main_workflow

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Skaffold's envTemplate tag policy and tox must use the same image tags.
  VERSION: latest
  AUTONOMY_IMAGE_VERSION: latest
  TENDERMINT_IMAGE_VERSION: latest
  HARDHAT_IMAGE_VERSION: latest
  POETRY_VERSION: "2.3.2"
  TOMTE_VERSION: "0.7.0"
  PROTOC_VERSION: "24.3"
  IPFS_VERSION: "0.6.0"
  TENDERMINT_VERSION: "0.34.19"
  SKAFFOLD_VERSION: "1.39.1"
  PROTOLINT_VERSION: "0.27.0"
  GITLEAKS_VERSION: "8.10.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOX_SKIP_MISSING_INTERPRETERS: "false"

jobs:
  lock_check:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, windows-2025 ]
        python-version: ["3.14"]

    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: python -m pip install "poetry==$POETRY_VERSION"
    - name: Check if dependencies can be locked
      run: poetry check --lock
    - name: Poetry install requirements and check they can be locked
      run: poetry install --all-extras --no-interaction -vvv

  install_check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        python-version: ["3.14"]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check clean installation
      run: |
        python -m pip install ".[all]" --no-cache-dir
        python -m pip check
        autonomy --help

  copyright_doc_and_dependencies_check:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.14"]

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install "tomte[tox,cli]==$TOMTE_VERSION"
    - name: Check copyright headers
      run: tox -e check-copyright
    - name: License compatibility check
      run: tox -e liccheck
    - name: Check docs
      run: tox -e check-api-docs
    - name: Check doc links and IPFS hashes
      run: tox -e check-doc-links-hashes
    - name: Check dependencies
      run: tox -e check-dependencies
    - name: Check third-party hashes
      run: tox -e check-third-party-hashes

  linter_checks:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.13"]  # use 3.14 after https://github.com/akaihola/darglint2/issues/44 is fixed

    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install "tomte[tox]==$TOMTE_VERSION"
        tools_dir="$RUNNER_TEMP/ci-tools"
        mkdir -p "$tools_dir"
        curl --fail --location --retry 3 -o "$tools_dir/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
        echo "$tools_dir/protoc/bin" >> "$GITHUB_PATH"
        curl --fail --location --retry 3 -o "$tools_dir/ipfs.tar.gz" "https://github.com/ipfs/kubo/releases/download/v${IPFS_VERSION}/go-ipfs_v${IPFS_VERSION}_linux-amd64.tar.gz"
        tar -xzf "$tools_dir/ipfs.tar.gz" -C "$tools_dir"
        sudo install "$tools_dir/go-ipfs/ipfs" /usr/local/bin/ipfs
        ipfs init
        curl --fail --location --retry 3 -o "$tools_dir/protolint.tar.gz" "https://github.com/yoheimuta/protolint/releases/download/v${PROTOLINT_VERSION}/protolint_${PROTOLINT_VERSION}_Linux_x86_64.tar.gz"
        mkdir -p "$tools_dir/protolint"
        tar -xzf "$tools_dir/protolint.tar.gz" -C "$tools_dir/protolint"
        sudo install "$tools_dir/protolint/protolint" /usr/local/bin/protolint
    - name: Check generate protocols
      run: tox -e check-generate-all-protocols
    - name: Security checks
      run: |
        tox -e bandit
        tox -e safety
    - name: Check packages
      run: tox -e check-packages
    - name: Check hash
      run: tox -e check-hash
    - name: Code style check
      run: |
        tox -e black-check
        tox -e isort-check
        tox -e check-isort-config
        tox -e flake8
        tox -e vulture
        tox -e darglint
    - name: Static type check
      run: tox -e mypy
    - name: Pylint
      run: tox -e pylint
    - name: AbciApp consistency checks
      run: |
        tox -e check-abci-docstrings
        tox -e check-abciapp-specs
        tox -e check-handlers
        tox -e check-dialogues

  scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Scan repository history for secrets
        run: |
          tools_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 -o "$tools_dir/gitleaks.tar.gz" "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$tools_dir/gitleaks.tar.gz" -C "$tools_dir"
          sudo install "$tools_dir/gitleaks" /usr/local/bin/gitleaks
          python -m pip install "tomte[tox]==$TOMTE_VERSION"
          tox -e gitleaks

  test:
    env:
      # Optional: fork pull requests and repositories without Codecov still run.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    needs:
      - lock_check
      - install_check
      - linter_checks
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false  # prevents all matrix jobs from canceling if one fails
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15-intel
            python-version: "3.10"
          - os: macos-15-intel
            python-version: "3.14"
          - os: windows-2025
            python-version: "3.10"
          - os: windows-2025
            python-version: "3.14"

    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.os == 'ubuntu-24.04'
        name: Install dependencies (ubuntu-24.04)
        run: |
          python -m pip install "tomte[tox]==$TOMTE_VERSION"
          tools_dir="$RUNNER_TEMP/ci-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 -o "$tools_dir/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
          echo "$tools_dir/protoc/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o "$tools_dir/ipfs.tar.gz" "https://github.com/ipfs/kubo/releases/download/v${IPFS_VERSION}/go-ipfs_v${IPFS_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$tools_dir/ipfs.tar.gz" -C "$tools_dir"
          sudo install "$tools_dir/go-ipfs/ipfs" /usr/local/bin/ipfs
          ipfs init
          curl --fail --location --retry 3 -o "$tools_dir/tendermint.tar.gz" "https://github.com/tendermint/tendermint/releases/download/v${TENDERMINT_VERSION}/tendermint_${TENDERMINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$tools_dir/tendermint"
          tar -xzf "$tools_dir/tendermint.tar.gz" -C "$tools_dir/tendermint"
          sudo install "$tools_dir/tendermint/tendermint" /usr/local/bin/tendermint
          curl --fail --location --retry 3 -o "$tools_dir/skaffold" "https://storage.googleapis.com/skaffold/releases/v${SKAFFOLD_VERSION}/skaffold-linux-amd64"
          sudo install "$tools_dir/skaffold" /usr/local/bin/skaffold
          skaffold version
          # Build the CI profile once; VERSION supplies the latest tag.
          skaffold build -p ci --push=false
          # Older fixtures also refer to these fixed Tendermint tags.
          docker tag valory/open-autonomy-tendermint:latest valory/open-autonomy-tendermint:0.1.0
          docker tag valory/open-autonomy-tendermint:latest valory/open-autonomy-tendermint:1.0.0
          docker pull valory/autonolas-registries:latest
          docker pull valory/acn-node:latest
          docker pull tendermint/tendermint:v${TENDERMINT_VERSION}
          docker pull valory/slow-tendermint-server:0.1.0
          docker info
          docker compose version

      - if: matrix.os == 'ubuntu-24.04'
        name: Framework unit tests ubuntu-24.04
        run: |
          tox -e py${{ matrix.python-version }}-linux -- -m 'not e2e'

      - if: matrix.os == 'ubuntu-24.04'
        name: Packages unit tests ubuntu-24.04
        run: |
          # The 3.10 coverage-specific group drops {posargs}; use the regular
          # group so the e2e marker exclusion reaches pytest on every version.
          tox -e packages-py${{ matrix.python-version }}-linux \
            -x 'testenv:packages-py3.10-linux.commands={[commands-packages]commands}' \
            -- -m 'not e2e'

      - if: matrix.os == 'macos-15-intel'
        name: Set macOS SDK root
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - if: matrix.os == 'macos-15-intel'
        name: Install dependencies (macos-15-intel)
        run: |
          python -m pip install "tomte[tox]==$TOMTE_VERSION"
          tools_dir="$RUNNER_TEMP/ci-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 -o "$tools_dir/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-x86_64.zip"
          unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
          echo "$tools_dir/protoc/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o "$tools_dir/ipfs.tar.gz" "https://github.com/ipfs/kubo/releases/download/v${IPFS_VERSION}/go-ipfs_v${IPFS_VERSION}_darwin-amd64.tar.gz"
          tar -xzf "$tools_dir/ipfs.tar.gz" -C "$tools_dir"
          sudo install "$tools_dir/go-ipfs/ipfs" /usr/local/bin/ipfs
          ipfs init
          curl --fail --location --retry 3 -o "$tools_dir/tendermint.tar.gz" "https://github.com/tendermint/tendermint/releases/download/v${TENDERMINT_VERSION}/tendermint_${TENDERMINT_VERSION}_darwin_amd64.tar.gz"
          mkdir -p "$tools_dir/tendermint"
          tar -xzf "$tools_dir/tendermint.tar.gz" -C "$tools_dir/tendermint"
          sudo install "$tools_dir/tendermint/tendermint" /usr/local/bin/tendermint
          curl --fail --location --retry 3 -o "$tools_dir/skaffold" "https://storage.googleapis.com/skaffold/releases/v${SKAFFOLD_VERSION}/skaffold-darwin-amd64"
          sudo install "$tools_dir/skaffold" /usr/local/bin/skaffold
          skaffold version
          curl --fail --location --retry 3 -o "$tools_dir/protolint.tar.gz" "https://github.com/yoheimuta/protolint/releases/download/v${PROTOLINT_VERSION}/protolint_${PROTOLINT_VERSION}_Darwin_x86_64.tar.gz"
          mkdir -p "$tools_dir/protolint"
          tar -xzf "$tools_dir/protolint.tar.gz" -C "$tools_dir/protolint"
          sudo install "$tools_dir/protolint/protolint" /usr/local/bin/protolint

      - if: matrix.os == 'macos-15-intel'
        name: Framework unit tests macos-15-intel
        run: |
          tox -e py${{ matrix.python-version }}-darwin -- -m 'not e2e'

      - if: matrix.os == 'macos-15-intel'
        name: Packages unit tests macos-15-intel
        run: |
          tox -e packages-py${{ matrix.python-version }}-darwin -- -m 'not e2e'

      - if: matrix.os == 'windows-2025'
        name: Install dependencies (windows-2025)
        shell: pwsh
        run: |
          python -m pip install "tomte[tox]==$env:TOMTE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Could not install CI tooling" }
          $toolsDir = Join-Path $env:RUNNER_TEMP "ci-tools"
          $binDir = Join-Path $toolsDir "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip" -OutFile "$toolsDir/protoc.zip"
          Expand-Archive -Path "$toolsDir/protoc.zip" -DestinationPath "$toolsDir/protoc"
          "$toolsDir/protoc/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Invoke-WebRequest "https://github.com/ipfs/kubo/releases/download/v$env:IPFS_VERSION/go-ipfs_v$($env:IPFS_VERSION)_windows-amd64.zip" -OutFile "$toolsDir/ipfs.zip"
          Expand-Archive -Path "$toolsDir/ipfs.zip" -DestinationPath $toolsDir
          Copy-Item "$toolsDir/go-ipfs/ipfs.exe" -Destination $binDir
          Invoke-WebRequest "https://github.com/tendermint/tendermint/releases/download/v$env:TENDERMINT_VERSION/tendermint_$($env:TENDERMINT_VERSION)_windows_amd64.tar.gz" -OutFile "$toolsDir/tendermint.tar.gz"
          tar -xzf "$toolsDir/tendermint.tar.gz" -C $binDir
          if ($LASTEXITCODE -ne 0) { throw "Could not extract Tendermint" }
          Invoke-WebRequest "https://github.com/yoheimuta/protolint/releases/download/v$env:PROTOLINT_VERSION/protolint_$($env:PROTOLINT_VERSION)_Windows_x86_64.tar.gz" -OutFile "$toolsDir/protolint.tar.gz"
          tar -xzf "$toolsDir/protolint.tar.gz" -C $binDir
          if ($LASTEXITCODE -ne 0) { throw "Could not extract protolint" }
          Invoke-WebRequest "https://storage.googleapis.com/skaffold/releases/v$env:SKAFFOLD_VERSION/skaffold-windows-amd64.exe" -OutFile "$binDir/skaffold.exe"
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$binDir/ipfs.exe" init
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize IPFS" }
          & "$binDir/skaffold.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Could not run Skaffold" }

      - if: matrix.os == 'windows-2025'
        name: Framework unit tests windows-2025
        run: |
          tox -e py${{ matrix.python-version }}-win -- -m 'not e2e' -vv

      - if: matrix.os == 'windows-2025'
        name: Packages unit tests windows-2025
        run: |
          tox -e packages-py${{ matrix.python-version }}-win -- -m 'not e2e'

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

  e2e:
    needs:
      - lock_check
      - install_check
      - linter_checks
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        python-version: [ "3.14" ]

    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install "tomte[tox]==$TOMTE_VERSION"
          tools_dir="$RUNNER_TEMP/ci-tools"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 -o "$tools_dir/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
          echo "$tools_dir/protoc/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o "$tools_dir/ipfs.tar.gz" "https://github.com/ipfs/kubo/releases/download/v${IPFS_VERSION}/go-ipfs_v${IPFS_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$tools_dir/ipfs.tar.gz" -C "$tools_dir"
          sudo install "$tools_dir/go-ipfs/ipfs" /usr/local/bin/ipfs
          ipfs init
          curl --fail --location --retry 3 -o "$tools_dir/tendermint.tar.gz" "https://github.com/tendermint/tendermint/releases/download/v${TENDERMINT_VERSION}/tendermint_${TENDERMINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$tools_dir/tendermint"
          tar -xzf "$tools_dir/tendermint.tar.gz" -C "$tools_dir/tendermint"
          sudo install "$tools_dir/tendermint/tendermint" /usr/local/bin/tendermint
          curl --fail --location --retry 3 -o "$tools_dir/skaffold" "https://storage.googleapis.com/skaffold/releases/v${SKAFFOLD_VERSION}/skaffold-linux-amd64"
          sudo install "$tools_dir/skaffold" /usr/local/bin/skaffold
          skaffold version
          # Build the CI profile once; VERSION supplies the latest tag.
          skaffold build -p ci --push=false
          # Older fixtures also refer to these fixed Tendermint tags.
          docker tag valory/open-autonomy-tendermint:latest valory/open-autonomy-tendermint:0.1.0
          docker tag valory/open-autonomy-tendermint:latest valory/open-autonomy-tendermint:1.0.0
          docker pull valory/autonolas-registries:latest
          docker pull valory/acn-node:latest
          docker pull tendermint/tendermint:v${TENDERMINT_VERSION}
          docker pull valory/slow-tendermint-server:0.1.0
          docker info
          docker compose version

      - name: End-to-end tests
        run: |
          tox --develop -e e2e-py${{ matrix.python-version }}-linux -- -m 'e2e'

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - lock_check
      - install_check
      - copyright_doc_and_dependencies_check
      - linter_checks
      - scan
      - test
      - e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any dependency did not succeed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs failed, were cancelled, or were skipped."
            exit 1
          fi
